name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Format, rules, the signature against keys.json, and every download's
      # size and sha256. The signing key is never available here.
      - run: node scripts/validate.js --signature --assets
